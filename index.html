<!DOCTYPE html>
<html lang="en">

<head>
    <title>SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

        <a class="navbar-brand" href="sku.html">SKU Generator</a>

        <div>
            <a class="btn btn-primary" href="sku.html">
                Receipt Generator
            </a>
        </div>

    </div>
</nav>
   <div class="container bg-light p-4 mt-5 w-50 rounded shadow">

        <h1>SKU Generator</h1>

        <label>Product Category</label>
        <input type="text" id="category" class="form-control">

        <br>

        <label>Product Name</label>
        <input type="text" id="product_name" class="form-control">

        <br>

        <label>Stock Quantity</label>
        <input type="number" id="stock_qty" class="form-control">

        <br>

        <button py-click="generate_sku" class="btn btn-primary">
            Generate SKU
        </button>

        <br><br>

        <div id="sku_receipt"></div>

        <br>

        <a href="index.html">Receipt Generator</a>

    </div>

    <script type="py" src="sku.py"></script>

</body>
</html>
