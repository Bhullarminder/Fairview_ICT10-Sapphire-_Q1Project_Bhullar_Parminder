<!DOCTYPE html>
<html lang="en">

<head>
    <title>SKU Generator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>

<body>

    <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container-fluid">

        <a class="navbar-brand" href="sku.html">SKU Generator</a>

        <div>
            <a class="btn btn-primary" href="sku.html">
                Receipt Generator
            </a>
        </div>

    </div>
</nav>
   <div class="container bg-light p-4 mt-5 w-50 rounded shadow">

        <h1>SKU Generator</h1>

    <label>Product Category</label>
    <select id="category" class="form-select">
        <option value="Coffee">Coffee</option>
        <option value="Tea">Tea</option>
        <option value="Pastry">Pastry</option>
        <option value="Ramen">Ramen</option>
    </select>

    <br>

    <label>Product Name</label>
    <select id="product_name" class="form-select">
        <option value="Americano">Americano</option>
        <option value="Spanish Latte">Spanish Latte</option>
        <option value="Croissant">Croissant</option>
        <option value="Tonkotsu">Tonkotsu</option>
    </select>

    <br>

    <label>Stock Quantity</label>
    <input type="number" id="stock_qty" class="form-control">

    <br>

    <button py-click="generate_sku" class="btn btn-primary">
        Generate SKU
    </button>

    <br><br>

    <div id="sku_receipt"></div>

</div>
    
    <script type="py" src="sku.py"></script>

</body>
</html>
